# AALC (边狱巴士小助手) Android 打包配方
# 供 MaaFwApp 构建体系识别并打包 AALC-Meow 资源与应用标识

# 指向 AALC 资源项目根目录（含 interface.json）
assets: assets

# 进包白名单
include:
  - interface.json
  - tasks/**
  - resource/**
  - data/**
  - locales/**
  - CONTACT
  - LICENSE
  - logo.png

# 过滤不需要的开发与测试文件
exclude:
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/.venv/**"
  - "**/tests/**"
  - "**/*.pyc"

# 自动更新源配置
update:
  githubRepo: qi-1021/AALC-Meow

# 应用标识与图标
app:
  # 包名后缀，生成 com.aliothmoon.maafw.aalc
  id: aalc
  # 桌面显示名称
  label: AALC-Meow
  # 应用图标
  icon: logo.png
